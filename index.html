
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Aditi & Aprajita</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10002b;
    color: white;
    min-height: 100vh;
}

/* Animated background */
.background {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 20% 20%, #7b2ff7, transparent 35%),
      radial-gradient(circle at 80% 80%, #f107a3, transparent 35%),
      linear-gradient(135deg, #10002b, #240046, #3c096c);
    animation: bgMove 8s infinite alternate;
    z-index: -3;
}

@keyframes bgMove {
    0% { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(60deg); }
}

/* Stars */
.star {
    position: fixed;
    color: white;
    animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
    from { opacity: 0.2; transform: scale(0.7); }
    to { opacity: 1; transform: scale(1.3); }
}

/* Main content */
.container {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: clamp(30px, 7vw, 65px);
    color: #fff;
    text-shadow: 0 0 15px #ff00cc,
                 0 0 35px #ff00cc;
    animation: title 2s infinite alternate;
}

@keyframes title {
    from { transform: scale(1); }
    to { transform: scale(1.04); }
}

.names {
    font-size: clamp(25px, 5vw, 45px);
    margin: 15px;
    color: #ffe66d;
    text-shadow: 0 0 20px #ff9f1c;
    animation: nameGlow 2s infinite alternate;
}

@keyframes nameGlow {
    to { text-shadow: 0 0 35px #fff, 0 0 50px #ff9f1c; }
}

.message {
    max-width: 600px;
    font-size: 18px;
    line-height: 1.7;
    margin: 15px;
}

/* 3D cake */
.cake {
    position: relative;
    width: 180px;
    height: 150px;
    margin: 30px 0;
    animation: cakeFloat 3s infinite ease-in-out;
}

@keyframes cakeFloat {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-15px) rotate(2deg); }
}

.cake-base {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 85px;
    background: linear-gradient(#ff8fab, #fb6f92);
    border-radius: 15px 15px 25px 25px;
    box-shadow: 0 15px 0 #c9184a,
                0 25px 35px #0008;
}

.cake-top {
    position: absolute;
    top: 35px;
    width: 180px;
    height: 35px;
    border-radius: 50%;
    background: #ffc2d1;
    box-shadow: inset 0 -8px #ff8fab;
}

.candle {
    position: absolute;
    top: 0;
    left: 82px;
    width: 16px;
    height: 45px;
    background: repeating-linear-gradient(
        45deg, white 0 6px, #ff4d6d 6px 12px
    );
    border-radius: 5px;
}

.flame {
    position: absolute;
    top: -25px;
    left: 2px;
    width: 12px;
    height: 23px;
    background: #ffd166;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    box-shadow: 0 0 20px #ff9f1c;
    animation: flame 0.5s infinite alternate;
}

@keyframes flame {
    from { transform: rotate(-45deg) scale(1); }
    to { transform: rotate(-35deg) scale(1.2); }
}

/* Balloons */
.balloon {
    position: fixed;
    bottom: -150px;
    font-size: 60px;
    animation: balloonUp 10s linear infinite;
    z-index: -1;
}

@keyframes balloonUp {
    0% { transform: translateY(0) rotate(0); bottom: -150px; }
    50% { transform: translateX(40px) rotate(15deg); }
    100% { transform: translateY(-120vh) rotate(-15deg); bottom: 100vh; }
}

/* Buttons */
button {
    padding: 15px 30px;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    color: #5a189a;
    background: linear-gradient(45deg, #ffe66d, #ff9f1c);
    box-shadow: 0 0 25px #ff9f1c;
    cursor: pointer;
    margin: 10px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.12);
    box-shadow: 0 0 40px #fff;
}

/* Surprise */
#surprise {
    display: none;
    font-size: 25px;
    color: #ffe66d;
    margin-top: 20px;
    animation: surprise 1s ease;
}

@keyframes surprise {
    from { transform: scale(0) rotate(-20deg); }
    to { transform: scale(1) rotate(0); }
}

/* Hearts */
.heart {
    position: fixed;
    bottom: -50px;
    animation: heartUp 6s linear forwards;
    pointer-events: none;
}

@keyframes heartUp {
    to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}

/* Fireworks */
.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffe66d;
    box-shadow:
      0 -50px #ff006e,
      35px -35px #ffbe0b,
      50px 0 #8338ec,
      35px 35px #3a86ff,
      0 50px #ff006e,
      -35px 35px #ffbe0b,
      -50px 0 #8338ec,
      -35px -35px #3a86ff;
    animation: explode 1s ease-out forwards;
}

@keyframes explode {
    from { transform: scale(0); opacity: 1; }
    to { transform: scale(1.5); opacity: 0; }
}

.footer {
    margin-top: 15px;
    color: #ffd6ff;
    font-size: 16px;
}

</style>
</head>

<body>

<div class="background"></div>

<div class="container">

    <h1>🎉 Happy Birthday 🎉</h1>

    <div class="names">
        Aditi & Aprajita 💖
    </div>

    <p class="message">
        Two beautiful souls, one special day!<br>
        May your lives be filled with endless happiness,
        love, laughter and magical memories.
    </p>

    <div class="cake">
        <div class="candle">
            <div class="flame"></div>
        </div>
        <div class="cake-top"></div>
        <div class="cake-base"></div>
    </div>

    <h2>Make a wish! 🌟</h2>

    <button onclick="birthdaySurprise()">
        🎁 Open Birthday Surprise
    </button>

    <div id="surprise">
        💝 Happy Birthday Aditi & Aprajita! 💝<br>
        May all your dreams come true! 🎂
    </div>

    <div class="footer">
        Made with ❤️ and lots of wishes
    </div>

</div>

<script>

/* Create stars */
for (let i = 0; i < 70; i++) {
    let star = document.createElement("div");
    star.className = "star";
    star.innerHTML = "✦";
    star.style.left = Math.random() * 100 + "vw";
    star.style.top = Math.random() * 100 + "vh";
    star.style.fontSize = Math.random() * 15 + 8 + "px";
    star.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(star);
}

/* Create balloons */
let balloonEmojis = ["🎈", "🎈", "💖", "🎈", "🎈"];

balloonEmojis.forEach((emoji, i) => {
    let balloon = document.createElement("div");
    balloon.className = "balloon";
    balloon.innerHTML = emoji;
    balloon.style.left = (i * 20 + 5) + "vw";
    balloon.style.animationDelay = (i * 2) + "s";
    document.body.appendChild(balloon);
});

/* Surprise */
function birthdaySurprise() {
    document.getElementById("surprise").style.display = "block";

    createFireworks();
    createHearts();

    alert("🎂 Happy Birthday Aditi & Aprajita! 🎉");
}

/* Fireworks */
function createFireworks() {
    for (let i = 0; i < 20; i++) {
        setTimeout(() => {
            let firework = document.createElement("div");
            firework.className = "firework";
            firework.style.left = Math.random() * 100 + "vw";
            firework.style.top = Math.random() * 70 + "vh";
            document.body.appendChild(firework);

            setTimeout(() => firework.remove(), 1000);
        }, i * 150);
    }
}

/* Floating hearts */
function createHearts() {
    for (let i = 0; i < 40; i++) {
        setTimeout(() => {
            let heart = document.createElement("div");
            heart.className = "heart";
            heart.innerHTML = ["💖", "💕", "💗", "💝"][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = (20 + Math.random() * 30) + "px";
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 6000);
        }, i * 100);
    }
}

/* Automatic fireworks */
setInterval(() => {
    let firework = document.createElement("div");
    firework.className = "firework";
    firework.style.left = Math.random() * 100 + "vw";
    firework.style.top = Math.random() * 60 + "vh";
    document.body.appendChild(firework);

    setTimeout(() => firework.remove(), 1000);
}, 1800);

</script>

</body>
</html>
